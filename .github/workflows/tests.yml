name: UIKit Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      egchainable_ref:
        description: Matching EGChainable revision
        default: main
        required: true

jobs:
  test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: DeclarativeUIKit
    steps:
      - uses: actions/checkout@v4
        with:
          path: DeclarativeUIKit
      - uses: actions/checkout@v4
        with:
          repository: EkkoG/EGChainable
          ref: ${{ inputs.egchainable_ref || vars.EGCHAINABLE_REF || 'main' }}
          path: EGChainable
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Install locked dependencies
        run: pod install --project-directory=Example --deployment
      - name: Check Core and Ext without optional dependencies
        run: bash scripts/check-core.sh
      - name: Check SDK selection and binding generation
        run: python3 -B ../EGChainable/scripts/test_generate.py
      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run UIKit tests
        run: |
          xcodebuild test \
            -workspace Example/DeclarativeUIKit.xcworkspace \
            -scheme DeclarativeUIKit-Example \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=13.0 SWIFT_VERSION=5.0
      - name: Check optional module clients
        run: python3 scripts/check-modules.py DerivedData/Build/Products/Debug-iphonesimulator
      - name: Check generated sources
        run: python3 ../EGChainable/scripts/generate.py --declarative-root "$PWD" --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UIKit-Test-Results
          path: DeclarativeUIKit/TestResults.xcresult
          if-no-files-found: ignore
